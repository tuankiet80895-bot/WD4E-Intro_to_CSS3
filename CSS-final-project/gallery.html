<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Travel Journal - Gallery</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <a href="#main-content" class="skip-link">Skip to Main Content</a>
  <header>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="gallery.html" aria-current="page">Gallery</a></li>
        <li><a href="places.html">Favorite Places</a></li>
      </ul>
    </nav>
    <h1>Scenery Gallery</h1>
  </header>
  <main id="main-content">
    <h2>My favorite scenes</h2>
    <div class="grid">
      <figure>
        <img src="images/photo1.jpg" alt="Sunset on a quiet beach with a palm tree">
        <figcaption>Sunset Beach</figcaption>
      </figure>
      <figure>
        <img src="images/photo2.jpg" alt="Layers of misty blue mountains under a pale sun">
        <figcaption>Misty Mountains</figcaption>
      </figure>
      <figure>
        <img src="images/photo3.jpg" alt="A calm lake surrounded by pine trees and distant mountains">
        <figcaption>Pine Lake</figcaption>
      </figure>
      <figure>
        <img src="images/photo4.jpg" alt="A city skyline at night with lit windows and a crescent moon">
        <figcaption>City at Night</figcaption>
      </figure>
      <figure>
        <img src="images/photo5.jpg" alt="Rows of tall green pine trees in a foggy forest">
        <figcaption>Foggy Forest</figcaption>
      </figure>
      <figure>
        <img src="images/photo6.jpg" alt="Orange sand dunes under a warm afternoon sun">
        <figcaption>Desert Dunes</figcaption>
      </figure>
    </div>
  </main>
  <footer>
